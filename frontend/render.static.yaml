# Reference for Render STATIC SITES. If your frontend service was created in the dashboard, add the same
# rule there instead:  Dashboard → your static site → Redirects/Rewrites → Add Rule
#   Source: /*     Destination: /index.html     Action: Rewrite
services:
  - type: web
    name: muddo-agrochemicals-site
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # e.g. https://muddo-agro-api.onrender.com/api/v1  (must be present at BUILD time)
